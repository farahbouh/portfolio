  <header>
    <nav class="container">
      <span class="logo">Farah Bouhnaida</span>

  <main class="container">
    <h1>Contact</h1>
    <p>Une question, une opportunité de collaboration ? Écrivez-moi !</p>

    <form action="/contact" method="POST" class="formulaire">
      <div class="ligne-formulaire">
        <div class="champ">
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" name="prenom" required>
        </div>

        <div class="champ">
          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom" required>
        </div>
      </div>

      <div class="champ">
        <label for="moyen-contact">Email/téléphone</label>
        <input type="text" id="moyen-contact" name="moyen-contact" required>
      </div>

      <div class="champ">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <button type="submit">Envoyer</button>
    </form>
  </main>

  <footer>
    <div class="container">
      <span>2026 Farah Bouhnaida</span>
